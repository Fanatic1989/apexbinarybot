<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex Bot — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#050810;--bg2:#0b0f1c;--bg3:#111827;--bdr:rgba(255,255,255,0.07);--bdr2:rgba(255,255,255,0.12);--green:#00f5a0;--red:#ff4d6d;--blue:#4d9fff;--amber:#ffb347;--purple:#a78bfa;--muted:#64748b;--text:#e2e8f0;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,160,0.012) 2px,rgba(0,245,160,0.012) 4px);pointer-events:none;z-index:0}
    nav{position:sticky;top:0;z-index:100;background:rgba(5,8,16,0.96);border-bottom:1px solid var(--bdr);backdrop-filter:blur(12px);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--green);letter-spacing:2px}
    .brand span{color:var(--red);font-weight:400}
    .page{position:relative;z-index:1;padding:18px 24px;max-width:1400px;margin:0 auto}
    .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:16px 20px;margin-bottom:14px}
    .ctitle{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;font-family:var(--mono)}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
    .metric{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
    .metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
    .mv{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--green)}
    .mv.amb{color:var(--amber)}.mv.blu{color:var(--blue)}.mv.red{color:var(--red)}
    .ml{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
    .btn{padding:6px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--mono);transition:all .15s}
    .bg{background:var(--green);color:#000;border-color:var(--green)}
    .br{background:transparent;color:var(--muted);border-color:var(--bdr2)}
    .ba{background:rgba(255,179,71,0.1);color:var(--amber);border-color:rgba(255,179,71,0.3)}
    .brd{background:rgba(255,77,109,0.1);color:var(--red);border-color:rgba(255,77,109,0.3)}
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:12px}
    thead th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:500;font-family:var(--mono);font-size:10px;border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
    tbody td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.04);color:#94a3b8;vertical-align:middle}
    tbody tr:hover td{background:rgba(255,255,255,0.02)}
    tbody tr:last-child td{border-bottom:none}
    .pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;font-family:var(--mono)}
    .pg{background:rgba(0,245,160,0.1);color:var(--green);border:1px solid rgba(0,245,160,0.25)}
    .pb{background:rgba(77,159,255,0.1);color:var(--blue);border:1px solid rgba(77,159,255,0.25)}
    .pa{background:rgba(255,179,71,0.1);color:var(--amber);border:1px solid rgba(255,179,71,0.25)}
    .pr{background:rgba(255,77,109,0.1);color:var(--red);border:1px solid rgba(255,77,109,0.25)}
    #toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--green);color:#000;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;font-family:var(--mono);display:none}
  </style>
</head>
<body>
<nav>
  <div class="brand">APEX<span>/ADMIN</span></div>
  <div style="display:flex;gap:8px">
    <a href="/"><button class="btn br">← Bot Dashboard</button></a>
    <a href="/logout"><button class="btn br">Logout</button></a>
  </div>
</nav>

<div class="page">

  <div class="metrics" id="admin-metrics">
    <div class="metric"><div class="mv" id="m-total">—</div><div class="ml">Total Users</div></div>
    <div class="metric"><div class="mv" id="m-active">—</div><div class="ml">Active Subs</div></div>
    <div class="metric"><div class="mv blu" id="m-trial">—</div><div class="ml">On Trial</div></div>
    <div class="metric"><div class="mv red" id="m-expired">—</div><div class="ml">Expired</div></div>
    <div class="metric"><div class="mv amb" id="m-running">—</div><div class="ml">Bots Running</div></div>
    <div class="metric"><div class="mv" id="m-revenue">—</div><div class="ml">MRR (est.)</div></div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span class="ctitle" style="margin-bottom:0">User Management</span>
      <button class="btn br" onclick="loadUsers()">↻ Refresh</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Username</th><th>Email</th><th>Status</th><th>Expires</th>
          <th>Trades</th><th>Win Rate</th><th>P&amp;L</th><th>Bot</th><th>Actions</th>
        </tr></thead>
        <tbody id="user-tbody">
          <tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
function api(url, cb, opts={}) {
  fetch(url, opts).then(r=>r.json()).then(cb).catch(e=>console.error(url,e));
}

function loadUsers() {
  api('/admin/users', d => {
    const users = d.users || [];
    let total=0, active=0, trial=0, expired=0, running=0;

    let h = '';
    users.forEach(u => {
      total++;
      const sub = u.sub_status || {};
      if(sub.status==='active')  active++;
      if(sub.status==='trial')   trial++;
      if(sub.status==='expired') expired++;
      if(u.bot_running) running++;

      const statusPill = sub.status==='active' ? '<span class="pill pg">ACTIVE</span>'
        : sub.status==='trial'   ? '<span class="pill pb">TRIAL</span>'
        : sub.status==='expired' ? '<span class="pill pr">EXPIRED</span>'
        : '<span class="pill" style="background:rgba(100,116,139,0.1);color:#64748b">—</span>';

      const expires = sub.ends ? sub.ends.slice(0,10)
                    : sub.status==='trial' ? `Trial: ${sub.hours_left||0}h left`
                    : '—';

      const tot   = u.total_trades  || 0;
      const wins  = u.total_wins    || 0;
      const wr    = tot > 0 ? ((wins/tot)*100).toFixed(1)+'%' : '—';
      const pnl   = parseFloat(u.net_pnl||0);
      const pnlStr= pnl>=0 ? `<span style="color:var(--green)">+$${pnl.toFixed(2)}</span>`
                           : `<span style="color:var(--red)">-$${Math.abs(pnl).toFixed(2)}</span>`;
      const botPill = u.bot_running
        ? '<span class="pill pg" style="font-size:9px">RUNNING</span>'
        : '<span style="color:var(--muted);font-size:10px">stopped</span>';

      h += `<tr>
        <td style="font-family:var(--mono);font-weight:700;color:var(--text)">${u.username}</td>
        <td style="color:var(--muted)">${u.email||'—'}</td>
        <td>${statusPill}</td>
        <td style="font-family:var(--mono);font-size:11px">${expires}</td>
        <td style="font-family:var(--mono)">${tot}</td>
        <td style="font-family:var(--mono)">${wr}</td>
        <td>${pnlStr}</td>
        <td>${botPill}</td>
        <td style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn bg" onclick="extend('${u.username}',30)" title="Extend 30 days">+30d</button>
          <button class="btn ba" onclick="extend('${u.username}',7)"  title="Extend 7 days">+7d</button>
          ${u.suspended
            ? `<button class="btn bg" onclick="suspend('${u.username}',false)">Unsuspend</button>`
            : `<button class="btn brd" onclick="suspend('${u.username}',true)">Suspend</button>`
          }
        </td>
      </tr>`;
    });

    document.getElementById('user-tbody').innerHTML = h ||
      '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">No users yet</td></tr>';

    document.getElementById('m-total').textContent   = total;
    document.getElementById('m-active').textContent  = active;
    document.getElementById('m-trial').textContent   = trial;
    document.getElementById('m-expired').textContent = expired;
    document.getElementById('m-running').textContent = running;
    document.getElementById('m-revenue').textContent = '$'+(active*79);
  });
}

function extend(username, days) {
  api('/admin/extend-subscription', d => {
    if(d.ok) { toast(`${username} extended ${days}d ✓`); loadUsers(); }
    else toast(d.error||'Failed');
  }, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, days})
  });
}

function suspend(username, suspended) {
  api('/admin/suspend-user', d => {
    if(d.ok){ toast(`${username} ${suspended?'suspended':'unsuspended'}`); loadUsers(); }
    else toast(d.error||'Failed');
  }, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, suspend: suspended})
  });
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

loadUsers();
setInterval(loadUsers, 10000);
</script>
</body>
</html>
